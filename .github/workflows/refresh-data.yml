name: Refresh balance data

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'scripts/**'
      - 'src/data/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/refresh-data.yml'
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      sync_official:
        description: 'Fetch official Korabli announcements before building'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: refresh-balance-data
  cancel-in-progress: false

jobs:
  build-and-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sync official announcements
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.sync_official)
        run: npm run data:sync:official
      - run: npm run lint
      - run: npm run test:data
      - run: npm run build
      - name: Preserve sync review and failure reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: balance-data-review
          path: outputs/official-review/*.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Commit generated data and Pages output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/config data/database data/raw src/data/generated docs
          git diff --cached --quiet || git commit -m "chore: refresh balance data"
          git push
